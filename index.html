<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kiplog-bps/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <!-- SEC-08: zero third-party network by default. The Google domains below
         are the one deliberate, user-requested exception — Google sign-in
         (single allow-listed account) + Drive as the cross-device sync
         backend. See docs/ASSUMPTIONS.md for the decision record. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; font-src 'self' data:; object-src 'self' blob:; base-uri 'self'; worker-src 'self' blob:;"
    />
    <title>KipLog BPS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
